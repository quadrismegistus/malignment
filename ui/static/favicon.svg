<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The panel's own colours: a base point falling, an aligned point rising.
       The slopegraph in 32px, which is what this app is for. -->
  <rect width="32" height="32" rx="6" fill="#12121c"/>
  <line x1="8" y1="9" x2="24" y2="23" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="23" x2="24" y2="9" stroke="#1c7ed6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
