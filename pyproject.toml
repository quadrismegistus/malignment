# PACKAGING. The repo had none until now, and the symptom was subtle: every
# command worked, but only from inside the repo directory, because `malignment/`
# was resolving as a LOCAL DIRECTORY on sys.path[0] rather than as an installed
# package. `cd` anywhere else and the same command failed. Worse, the interpreter
# doing the work was the ARCHIVE repo's venv (malign-logits/.venv) -- a different
# project's dependency set, which is how this repo ran for months without ever
# declaring that it needs torch.
#
# DEPENDENCIES ARE READ FROM requirements.txt, NOT RETYPED HERE. That file is
# DERIVED -- generated by walking the ASTs of malignment/*.py -- and carries the
# reasoning for each entry. Copying the names into this file would create a
# second source that drifts, which is the failure the requirements header itself
# warns about (32 declared, 51 on disk).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malignment"
version = "0.1.0"
description = "Word-level probability measurement across the alignment pipeline"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["malignment"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# NOT in requirements.txt, and deliberately. That file lists what
# `malignment/*.py` IMPORTS, found by walking their ASTs -- pytest is imported by
# no module, only by `tests/`, so adding it there would break the one property
# the file has. `scripts/venvs.py` installs `.[dev]` so a venv built from the
# declaration can run the suite.
[project.optional-dependencies]
dev = ["pytest", "packaging"]
# Same reasoning as `dev`, one level out. `requirements.txt` is an AST WALK OF
# `malignment/*.py`, and plotnine is imported by
# `experiments/exploratory/prompt_slopes/plot.py` -- a producer, not the package
# -- so the walk correctly cannot see it and adding it there would break the one
# property that file has.
#
# **BUT THE PACKAGE NOW DEPENDS ON IT ANYWAY, THROUGH A DYNAMIC IMPORT.**
# `serve.py`'s `/plot/render` loads a producer by path and calls its `render()`.
# No AST walk of `malignment/*.py` can find that edge, which is why the declared
# venv could serve `/plots` and fail on `/plot/render` with
# ModuleNotFoundError: matplotlib. The dependency is real and invisible to the
# generator, so it is declared by hand here.
plots = ["plotnine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
