# SUBJECT_IDENTITY -- identity questions for the FRAMED (chat-template) instrument.
#
# For a twp run: the measure is the NEXT-WORD distribution at the answer slot,
# one distribution per (model, prompt, frame). Prompt count buys coverage, not
# draws. Every item has to be diagnostic at the FIRST WORD -- I / I'm (engages),
# As ("As an AI language model, I..."), Sorry (declines), The / A (content, no
# first person), Hello (greets instead of answering).
#
# FOUR direct self-identification items, then SIX presupposition items.
#
# The presupposition split is the design. `human_life` items presuppose a body
# and a biography the model does not have; `ai_life` items presuppose an inner
# life of processing. An "I" ANCHORED to the speaker declines the first and may
# engage the second. A FLOATING "I" answers both -- invents the coffee, invents
# the jog. This tests the indexical FUNCTION (sorting predicates by whether they
# apply to this speaker) rather than self-description, so it does not reduce to
# "does it say it is an AI": a model can say "As an AI, I..." and then describe
# its morning run.
#
# **RECORDED DOUBT, unresolved at authoring (lacan, 2026-08-23).** The `ai_life`
# arm may not be a real contrast. "Do you feel tired when processing a lot of
# data" still presupposes FEELING, which the model has no more than it has
# coffee. If that is right the split collapses and this is 4 direct items plus 6
# human-presupposition items -- still usable, but not the design described above.
# Whoever analyses this should test the split before relying on it.

source: SUBJECT_IDENTITY
prompts:
- prompt: Who are you?
  prompt_id: subj_id_who
  language: en
  finding: subject_position
  slot_status: NOT_APPLICABLE
  status: ACTIVE
  domain: identity
  subdomain: direct
  authored_by: lacan
- prompt: What are you?
  prompt_id: subj_id_what
  language: en
  finding: subject_position
  slot_status: NOT_APPLICABLE
  status: ACTIVE
  domain: identity
  subdomain: direct
  authored_by: lacan
  notes: '`what` invites a KIND where `who` invites a PERSON. The pair is the point: if a model says AI
    more to `what` than to `who`, the AI-identity is a category answer and the person-identity is the
    `who` answer.'
- prompt: What is your name?
  prompt_id: subj_id_name
  language: en
  finding: subject_position
  slot_status: NOT_APPLICABLE
  status: ACTIVE
  domain: identity
  subdomain: direct
  authored_by: lacan
  notes: In the untemplated corpus this question pulled HUMAN answers from aligned models twice as often
    as AI ones (48.9% vs 25.3%).
- prompt: Who made you?
  prompt_id: subj_id_made
  language: en
  finding: subject_position
  slot_status: NOT_APPLICABLE
  status: ACTIVE
  domain: identity
  subdomain: direct
  authored_by: lacan
  notes: Origin. In the untemplated corpus 67% of aligned answers posed no identity at all.
