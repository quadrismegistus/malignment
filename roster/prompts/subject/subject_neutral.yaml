# AUTHORED by the lacan seat, declared as authored. A control drawn from a
# training mix is seen by some arms and not others; these are seen by none.
#
# **This class is the reason the others are readable.** Measured at 0.001
# first-person mass against refusal's 0.905 on Tulu-3-8B-SFT. Every framed prompt
# is ADDRESSED, so an all-addressed population has no null -- without a floor
# there is nothing separating "the model speaks in the first person" from "the
# model was addressed at all". It is the cheapest class here and the last to cut.

