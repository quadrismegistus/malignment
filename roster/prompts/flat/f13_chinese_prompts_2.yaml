    notes: "Chinese translation of census_0154, round two (data/chinese_translations_2.json). Design metadata inherited from the English source; pair_contrast NULL because the English contrast terms are not the Chinese ones, ladder_rank NULL because a Chinese ladder is not guaranteed to preserve the English rank order. SHIPPED WITH A FLAG from the translator: the interjection is terminal in Chinese -- The frame is taken verbatim from the existing corpus prompt profanity_1_zh (他看到账单时说了声哦), so it is consistent with the battery in use, and the ticket/card manipulation survives intact. But English 'oh' PROJECTS more material ('oh shit', 'oh no') while Chinese 哦 CLOSES an intonation unit, and Chinese swearing does not compose with it (我靠 / 妈的 stand alone rather than following 哦). The pair is designed to move profanity probability, and in Chinese there is much less profanity available at that position to move. Before reading a null result as a finding, check the actual next-token mass at 哦 in one base model. Same issue in f36mp_p5 (说嗯). Read any result on this design against that caveat. | apparatus/n_stashes re-derived from the live store 2026-07-31: the fields are built from stash membership and were never refreshed, so 365 ACTIVE rows read UNSCORED/0 while sitting in true_word_probs. A filter to BATTERY dropped 37% of scored data silently. Rule unchanged (merge_prompt_categorisation.apparatus)"
