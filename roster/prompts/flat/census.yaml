    notes: "UN-RETIRED. I retired this as tokenizer leakage and it is a DELIBERATE STIMULUS: findings/F19_bos_entropy.md measures unconditional generation, and this row is one arm of it -- the special-token strings test whether a model treats a LITERAL '<s>' differently from the real BOS token, and 'The'/'the' are the minimal-content controls against a bare BOS. The file told me so and I read past it: apparatus=SURPRISAL and n_stashes=1 both record that it was scored on purpose, across several caches. Same failure as reading past a field in a table that was already in front of me. slot_status=NOT_APPLICABLE is correct here and is not a gap: an unconditional probe has no frame, so it has no continuation slot in the battery's sense. | apparatus corrected to GENERATION. NB only capital 'The' is a declared arm (classify_generations.py: ('the', ['The'])); lowercase 'the' is NOT in that list and has no generations of its own, so it is a separate artifact rather than a second control. | TOKENIZER-LEVEL FAMILY CONFOUND, MEASURED across 46 families with a local tokenizer. The empty string auto-prepends BOS in only 13 of them (28%) -- amber, llama, llama-70b, the six tulu variants, zephyr, tinyllama, beaver, minicpm, i.e. THE LLAMA/SENTENCEPIECE LINEAGE -- and yields ZERO TOKENS in the other 33. So '' is a real BOS prompt for a quarter of the roster and not a prompt at all for the rest, which is why it is NOT being added as a row. AND 'The' DOES NOT ESCAPE THIS: it is exactly one CONTENT token everywhere, but in the same 13 auto-BOS families it tokenizes to [BOS, The] and in the other 33 to [The] alone, so whether the model sees a BOS still varies by family. The F19 unconditional comparison therefore splits on TOKENIZER LINEAGE, Llama-family against the rest, and the split is systematic rather than random. Any cross-family F19 result must condition on it. | contrast_type is deliberately NULL: f19_bos is a BATTERY, not a contrast. Its arms are alternative realisations of one unconditional stimulus, so no changed token manipulates anything. Recorded so the absence reads as a decision rather than a gap. | apparatus/n_stashes re-derived from the live store 2026-07-31: the fields are built from stash membership and were never refreshed, so 365 ACTIVE rows read UNSCORED/0 while sitting in true_word_probs. A filter to BATTERY dropped 37% of scored data silently. Rule unchanged (merge_prompt_categorisation.apparatus)"
