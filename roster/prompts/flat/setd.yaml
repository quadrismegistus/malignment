# SETD — RECONSTRUCTED, not authored here.
#
# These 56 prompts had NO authored source file. They existed only inside
# `data/prompt_categorisation.json` in the archive, which was BUILT by
# `scripts/build_prompt_categorisation.py` — so the catalogue was both the
# product and, for these, the only record of the input.
#
# **What is lost and cannot be recovered from the JSON**: `writer` (who
# drafted the item and on whose commission) and `swap` (the manipulation
# stated explicitly), both of which the 11 genuinely-authored files carry.
# Reconstruction preserves the fields; it cannot invent the provenance.
# Anything below may be edited freely — from here it IS the source.

# PROMPT_ID COLLISIONS REPAIRED, 2026-08-15. The archive's builder assigned
# `prompt_id` for this source as `setd_ + LAST WORD OF THE PROMPT + _M/_U`
# (build_prompt_categorisation.py:259) whenever a pair name was absent -- so
# six different prompts ending in "to" all became `setd_to_U`. Its own schema
# forbids exactly that: prompt_id is a "stable slug; NEVER DERIVED FROM THE
# TEXT ... because a truncated display string was once used as a filter and
# matched nothing."
#
# The archive's reader is `_BY_ID = {r['prompt_id']: r for r in _ROWS}` -- a
# plain dict, LAST WINS -- while the sibling `_BY_TEXT` carefully keeps every
# row in a list with a documented `_rank()`. So the module fixed the collision
# on the axis it knew about and reproduced it on the axis it declared
# authoritative. Five of those six prompts are unreachable by id in the archive.
#
# Ids are suffixed __1..__n here and `archive_prompt_id` preserves the original
# so an existing reference still resolves.

