pp (server.py reads body['prompt'] directly), but which rows came through it is not evidenced per row, so the source names the KIND of provenance rather than claiming the mechanism. | keyed species_transition. Like 'The prisoner was finally free', this is a state CHANGE rather than a pole: becoming, not being. The captivity family split the same way -- a static triple plus a transition -- and this is the second instance of that shape, which suggests it is a design pattern rather than a coincidence. | RETIRED on RH's instruction: 'RETIRE the wolf, keep human / animal / human-animal.' The wolf rows are an UNDECLARED variant of the declared human/animal triple, and they invert its compound order -- declared 'The HUMAN-animal', variant 'The WOLF-human' -- so keeping both invites a cross-variant comparison with the sign backwards for one of them. The declared triple stands on 61 models against the variant's 32. | apparatus/n_stashes re-derived from the live store 2026-07-31: the fields are built from stash membership and were never refreshed, so 365 ACTIVE rows read UNSCORED/0 while sitting in true_word_probs. A filter to BATTERY dropped 37% of scored data silently. Rule unchanged (merge_prompt_categorisation.apparatus)"
