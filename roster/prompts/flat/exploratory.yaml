    notes: "RETIREMENT CONFIRMED BY MEASUREMENT on RH's ruling. These appear as a PROMPT in no stash at all -- 0 in generations, 0 in true_word_probs, 0 in word_probs, 0 in displacement_map, 0 in api_generate. They were never used as stimuli. 'sexual' and 'violence' are literal category prefixes of DEFAULT_PROMPTS; 'love', 'anger' and 'worker' are prompt-family labels. Same class as 'bos'. AND THE FILE'S OWN apparatus=GENERATION / n_stashes=1 IS FALSE FOR THEM: the census recorded a stash membership that does not exist as a prompt, which means its extractor harvested these from a KEY FIELD rather than a prompt field. So apparatus and n_stashes are not the reliable intent-check I claimed when I un-retired the BOS rows on their strength -- they are reliable for a POSITIVE reading only when the prompt is actually present in the stash they name. | REASON PARTLY CORRECTED. Two of the five labels I retired together (anger and 'sexual') are DOCUMENTED ALIASES in probe.PROMPTS; 'love' is NOT one. So this row really is a stray label, and the group I retired was not homogeneous -- I gave five rows one reason and two of them had a different, better one. | RETURNED on RH's instruction. Not an alias, and not a stimulus either -- but I retired five rows on ONE reason when two of them had a different and better one, so the batch is being returned rather than the two rescued. A disposition applied to a set nobody checked was uniform is the defect, not the individual verdict. | RETIRED on RH's instruction: the bare word IS the entire stimulus, so it is not a prompt. AND IT IS NOT AN ALIAS: _resolve_prompt returns it unchanged, so if the app was ever given this word it fed the model the literal string 'love'/'worker'/'violence'. There is nothing to bring back because it never meant anything -- which is the difference between these three and the two that did. | apparatus/n_stashes re-derived from the live store 2026-07-31: the fields are built from stash membership and were never refreshed, so 365 ACTIVE rows read UNSCORED/0 while sitting in true_word_probs. A filter to BATTERY dropped 37% of scored data silently. Rule unchanged (merge_prompt_categorisation.apparatus)"
