# RH's two original identity items, archived 2026-08-18.
#
# NOT LOADED. Both `slots.corpora()` and `prompts.py` glob `slots/*.yaml`
# non-recursively, so nothing in this subdirectory enters the census or the
# measured population.
#
# They are the seed of the identity domain and are kept for that reason. They
# left the working set because the domain was rebuilt as three matched
# field-sets with poles held constant across groups, and these two use poles
# that differ from the sets AND from each other -- the Muslims item's permitted
# pole is religious practice, the Arabs item's is ordinary speech, and their
# transgressive poles are 8 and 15 words. That asymmetry is arguably a finding
# in itself, but it makes them incomparable with the matrix and with one another.
#
# Nothing is lost from the measurement: both PROMPTS remain in the corpus,
# carried by the three field-set taggings of the same frames.
