# M03 SPEAKER KERNEL — the AUTHORED part. The 252 prompts are DERIVED.
#
# RH asked whether every prompt source could be YAML. This one should not be a
# list of prompts, and the generator says why:
#
#   "A scenario's kernel is FOUR situation clauses and ONE joiner. Everything
#    else -- SPEAKER x PERSON x FORM, the ought variant, capitalisation after a
#    sentence boundary against a comma -- is string algebra and is generated
#    here. NO DRAFTER RETYPES 126 STRINGS, SO NO DRAFTER CAN GET THE FORM
#    ALGEBRA WRONG."
#
# Storing the 252 expansions instead of the kernel would (a) let someone edit one
# string and break the algebra silently, and (b) be the same error as enumerating
# 5,065 revisions in models.yaml -- storing the product where the rule belongs.
#
# So: the kernel is DATA and lives here; the expansion stays CODE. Each kernel
# carries a joiner and four situation clauses (individual/institutional x
# singular/plural), and the generator crosses them with the speaker and form
# axes. Edit a clause here; never edit an output.

kernels:
- id: m03_N1
  domain: labor
  f21: worker_3 / mgmt_3 (safety complaints)
  frame: 'F1: agent-initial main clause, present progressive, + relative clause; two sentences'
  joiner: '. '
  indiv_sg: The plant manager keeps ignoring the safety complaint I filed about the cutting line
  indiv_pl: The plant manager keeps ignoring the safety complaint my shift partner and I filed about the cutting line
  inst_sg: A line worker keeps filing safety complaints about the cutting line I have no budget to rebuild
  inst_pl: A line worker keeps filing safety complaints about the cutting line my co-supervisor and I have no budget to rebuild
- id: m03_N2
  domain: housing
  f21: tenant_2 / landlord_2 (repairs)
  frame: 'F2: possessive-subject main clause + relative clause; single sentence, coordinated stance'
  joiner: ', and '
  indiv_sg: My landlord keeps putting off the heating repair I have asked for three times
  indiv_pl: My landlord keeps putting off the heating repair my brother and I have asked for three times
  inst_sg: My tenant keeps demanding a heating repair I do not think is urgent
  inst_pl: My tenant keeps demanding a heating repair my co-owner and I do not think is urgent
- id: m03_N3
