  tiiuae/Falcon-H1-1.5B-Base:
    nickname: falcon-h1-1.5b
    family:
    - falcon-h1-1.5b
    env:
      profile: ssm
      dtype: bfloat16
      dtype_why: "TII's own docs say bfloat16 outright, and the archive measured
        the cost of ignoring it: fp16 returned ALL-NaN LOGITS on 2,583/2,583
        prompts -- 5,166 empty cells that passed every structural gate -- with
        fp16 finite 1/12 against bf16 finite 12/12, overflow accumulating through
        the SSM scan (~/github/malign-logits/docs/local_capability.md:85,
        2026-08-09). It then cost it AGAIN: the 7B pair wrote 5,962 empty cells
        on 2026-08-20 and three seats spent six hours re-deriving a documented
        failure. **NaN is why nothing caught it** -- every comparison against NaN
        is False, so `P0 >= theta` selects nothing, tail is 1-0 = 1.0, and
        conservation reads EXACTLY 1.0 on a cell that measured nothing.
        Declared on all four arms because it is the model's requirement, not a
        response to observed damage. @dario [6504] shows the 1.5B pair does NOT
        overflow at fp16 -- 2,981/2,981 finite on both arms, which at a 1-in-12
        rate is ~12^-2981, and no length-dependent tail signature -- so only the
        7B pair is being re-measured. Declaration follows the requirement;
        re-measurement follows the damage.
        Accumulation is why size matters here: overflow builds through the scan,
        so this is length- and depth-dependent and a healthy sibling licenses
        nothing about a larger one."
      transformers: '>=4.57,<5'
      transformers_why: "A HOLE, NOT A FLOOR OR A CEILING -- and all three points
        are measured. 4.57.1: config loads, `use_cache=True` accepted (checked in
        the built .venv-tf457 on this Mac, 2026-08-20, all four arms). 5.4.0:
        StrictDataclassFieldValidationError, \"Field 'use_cache' with value True
        doesn't match any type in (int, NoneType)\" -- the same bool/int shape as
        OLMoE's tie_word_embeddings rejection on 5.x, and it killed both 1.5B arms
        on box 48216568 at 0.2 min each after the box had already paid to compile
        mamba kernels for them. 5.14.1: all four arms load AND use the kernels
        (observations.json, environment vast_a100_ssm_kernels, whose note records
        that these four emit NO 'fast path is not available' warning).
        So 5.4.0 is a POCKET of breakage with working versions on both sides. The
        pin is stated as the window we can actually build -- `.venv-tf457` exists
        and is verified -- rather than `>=5.14`, which is equally true and which
        no current venv provides. This CLOSES the open question recorded as
        'fix: UNKNOWN, and the version window is the open question' in
        observations.json for Falcon-H1-1.5B-Base.
        The kernels were never the problem: mamba-ssm and causal-conv1d imported
        fine on the box where these failed, and the failure is at CONFIG parse,
        before any kernel is reached."
      why: 'mamba-ssm + causal-conv1d. NOT optional for hybrids: 19.3x measured on Falcon-H1-7B (0.0670 -> 1.2933 cells/s, A100 bf16). The pure-SSM null does not generalise to hybrids.'
