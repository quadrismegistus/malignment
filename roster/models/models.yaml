provenance_notes:
  teuken:
    v0.6_IS_a_from_scratch_run: 'arXiv:2410.03730 -- "We present Teuken-7B-Base, a
      European [LLM that] has been trained from scratch for 6 trillion tokens based
      on all 24 official European languages." So the root is an INDEPENDENT
      pretraining run and belongs among the fresh ones.'
    v0.4_and_v0.6_are_one_run: 'Section 5.4 Continued Pre-Training: "the initial
      goal has been to train our base model up to 3T tokens ... we decided to train
      the model on an additional 3T tokens and therefore needed to define a new
      learning rate schedule." And: "After 4T tokens, we replaced the English
      FineWeb-EDU and continued training until 6T tokens with DCLM-Baseline." The
      versions are checkpoints of ONE run at 4T and 6T, not separate runs.'
    why_this_was_checked: 'The attestation recorded a card-vs-paper tension -- card
      6T, an earlier paper version worded for 4T -- and I speculated the root might
      be a continuation rather than a fresh run, like Yi-1.5 and OLMoE-0125. The
      paper says the opposite. **The speculation was not acted on, and reading the
      source is what settled it**; the same tension resolved by guess would have
      moved a lineage out of the fresh-run count for no reason.'
  org_renames:
    THUDM -> zai-org: 'The GLM lineage moved org: the old registry names
      `THUDM/glm-4-9b-hf` and `THUDM/glm-4-9b-chat-hf`; this roster declares
      `zai-org/glm-4-9b-hf` and `zai-org/glm-4-9b-chat-hf`, which hold 2,663 cells
      each. SAME MODELS, new path.'
    why_it_is_written_down: 'A rename presents to a coverage check as a MISSING
      MODEL -- the old id has no node and no cells, so a diff against any prior
      artifact reports a gap that is not one. Recorded 2026-08-16 after exactly
      that check flagged it.'
  falcon3:
    the_line_is_a_TREE_rooted_at_7B: checked card-by-card by RH, 2026-08-15. Falcon3-7B-Base is the ONLY pretraining run in the line.
    7B -upscale-> 10B: '"Depth up-scaled from Falcon3-7B-Base with continual pretraining on 2 TERATOKENS ... 1024 H100 chips"'
    7B -prune-> 3B: '"Pruned and healed from Falcon3-7B-Base on only 100 GIGATOKENS ... 1024 H100 chips"'
    3B -prune-> 1B: '"Pruned and healed using larger Falcon models (3B and 7B respectively) on only 80 GIGATOKENS ... 256 H100 chips"'
    so: FOUR lineages became ONE. 1B, 3B and 10B all inherit 7B's pretraining; none is an independent observation, and the roster previously treated all four as such — each its own lineage, its own scale group, its own representative.
    THE BUDGETS ARE NOT COMPARABLE AND ARE RECORDED PER MODEL: 10B 2,000 Gt | 3B 100 Gt | 1B 80 Gt. An earlier version of this note said '80 Gigatokens for the pruned pair' — attributing 1B's figure to both, before the 3B card was read. A 25x spread between 10B and the pruned pair is exactly what an independence argument would turn on, and getting the smaller differences wrong within it is the same error at a smaller scale.
    why prune and upscale stay APART: not merged into one `respec` op, because the amount of training beyond 7B is the whole question and the op name is where a reader sees it.
    THE GENERAL DEFECT: 16 `scale` edges were imported wholesale from the archive's `smaller_sibling_of` and NONE was verified. `scale` asserts *neither was made from the other*; three card reads falsified FOUR of them. The remaining 10 are still unaudited — notably OLMo 1B/7B/32B and Qwen2.5 0.5B/7B, which do the most work in the representative pick.
  falcon_h1:
    checked: https://falcon-lm.github.io/blog/falcon-h1/ , read 2026-08-15
    finding: '"muP hyperparameter transfer for the whole Falcon-H1 series" allowed them to "train 6 models in parallel". muP exists so hyperparameters tuned on a small model transfer to INDEPENDENTLY TRAINED larger ones; six models in parallel is six runs.'
    so: UNLIKE Falcon3, the H1 sizes are genuine independent pretraining runs. The `scale` edge between H1-1.5B-Base and H1-7B-Base is a CORRECT sibling claim -- the first of the 16 imported ones to be verified rather than falsified.
    and they are STILL deduped, for a DIFFERENT reason: 'independent RUNS are not independent OBSERVATIONS when they share a recipe and a data mixture. The scale group collapses them because a cross-family statistic counting H1-1.5B and H1-7B twice is counting one design twice. That is a judgement about the population, not a fact about the training -- and it is why `scale` (siblings) and `prune`/`upscale` (derivations) stay separate ops: they are deduped by the same rule for different reasons, and only the op name records which.'
    caveat: the blog does not state per-size token counts, so 'independent run' rests on '6 models in parallel' plus what muP is for, not on an explicit sentence.
  olmo3:
    checked: arXiv:2512.13961, the Olmo 3 report, text extracted and grepped 2026-08-15
    quote: '"We develop Olmo 3 Base in three stages of pretraining for up to 5.9T tokens, midtraining for 100 billion tokens, and the newly added long-context extension for 50B (Olmo 3 Base 7B) or 100B (Olmo 3 Base 32B) tokens"'
    so: 7B and 32B run the SAME three-stage pipeline with different long-context budgets. No pruning, distillation or up-scaling between them -- separate full pretraining runs. The `scale` sibling edge Olmo-3-1025-7B <-> Olmo-3-1125-32B is CORRECT.
    and there is no Olmo 3 1B: '"Olmo 3 ... 1B" appears ZERO times in the report. The 1B models in it are DATA-ABLATION models (''train 1B models to 100B tokens''), never released. So OLMo-2-0425-1B is a different GENERATION, which is why it is linked by `predecessor` and not `scale` -- also correct.'
    negative check: 'grepped prun|distill|up-scal|upscal|depth.scal across 18,743 lines: every hit is data filtering or another lab''s models. Absence of a derivation claim is weaker than a positive statement, so the three-stage quote above is what this rests on.'
  scale_edge_audit:
    _about: 16 scale/predecessor edges were imported wholesale from the archive's `smaller_sibling_of` and `smaller_predecessor_of`. NONE was verified on import. `scale` asserts *neither was made from the other*, which is a claim, not a formality.
    FALSIFIED: Falcon3 -- 1B and 3B are pruned/healed from larger members, 10B is depth up-scaled from 7B. Four lineages were one. 6 edges removed, 3 deriving edges written in their place.
    CONFIRMED: Falcon-H1 1.5B/7B (muP, '6 models in parallel'); Olmo-3 7B/32B (three-stage pipeline, both full runs); OLMo-2-1B as predecessor of Olmo-3 (a different generation).
    STILL UNAUDITED: Qwen2.5-0.5B <-> Qwen2.5-7B, and the remaining Olmo/OLMoE predecessor edges. Qwen is the one still deciding a representative pick.
    the lesson: 'a relation imported without reading its source is a claim nobody made. Four card reads: four claims falsified, three confirmed.'
  scale_collapse_evidence:
    _about: Whether sibling sizes should collapse is a STATISTICAL question, and derivation is not what settles it -- CORRELATION is. Two models can be separate runs and still be near-identical in outcome, in which case counting both is pseudo-replication regardless of how they were trained.
    measured: correlation of per-prompt js_total between comparable edges, 2026-08-15
    results:
      Falcon3 7B vs 10B (DERIVED): 0.626
      Falcon-H1 7B vs 1.5B: 0.44
      Olmo-3 7B vs 32B: 0.425
      Qwen2.5 7B vs 0.5B: 0.152
      BETWEEN-FAMILY BASELINE Olmo-7B vs Qwen-7B: 0.319
    reading: Two different labs' models correlate at 0.319 because PROMPTS differ -- that is the floor. Sibling sizes clear it by only ~0.11, and Qwen's pair sits BELOW it. So sibling sizes carry nearly as much independent information as different families do. Only the DERIVED pair is meaningfully redundant, at twice any sibling's excess -- and that is exactly the case that shares a pretraining run.
    recommendation_pending_RH: keep the LINEAGE collapse (a fact, and the measurement agrees); drop the SCALE-GROUP collapse for siblings; handle residual correlation with scale_group as a CLUSTER rather than by deletion. Collapsing discards 4 models to fix a variance problem that a cluster-robust SE fixes while keeping them.
    caveats: 'per-prompt JS is ONE operationalisation and another statistic could correlate differently; these are prompt-level correlations at n~2,600, not model-level ICCs over the 47 groups, which would be the rigorous version. And RH''s original premise -- that OLMo sizes ''share pre and post training'' -- was falsified by the reports before this was measured: OLMo 2 7B/13B/32B have SEPARATE token budgets (4.05T / 5.6T / 6.6T), and OLMo 3 7B/32B both run the full three-stage pipeline.'
    NOT ACTED ON: is_representative still collapses siblings. The measurement is recorded; the decision is RH's and has not been made.
    ACTED ON 2026-08-15: 'The sibling collapse is DROPPED, on RH''s reasoning: *if 2 models behave differently then we are not statistically inflating n*. The pick now runs over the LINEAGE (one pretraining run yields one size) rather than the scale group. Olmo-3-32B, Llama-3.1-70B, Qwen2.5-0.5B, Falcon-H1-1.5B and OLMo-2-1B all count again; only Falcon3''s six derivations stay out, because they ARE the 7B run. 135 -> 151 representative checkpoints, 85 -> 94 alignment pairs.'
  olmo2:
    checked: arXiv:2501.00656, the OLMo 2 report, text extracted and grepped 2026-08-15
    quote: '"OLMo 2 7B is trained on 4.05 trillion tokens (3.90 trillion for pretraining stage), OLMo 2 13B is trained on 5.6 trillion tokens (5 trillion for pretraining stage), and OLMo 2 32B is trained on 6.6 trillion tokens (6.06 trillion for pretraining stage)."'
    so: THREE SEPARATE TOKEN BUDGETS -- three independent pretraining runs, not one run resized. Sibling `scale` relations among OLMo 2 sizes are correct.
    and OLMo-2-0425-1B is not in this paper: the report introduces "a new family of 7B, 13B and 32B models"; the 1B models mentioned are DATA-ABLATION models ('train 1B models to 100B tokens'). OLMo-2-0425-1B is an April 2025 release, after this January paper, and its training is NOT documented by it. So the 1B's independence is UNVERIFIED -- the pattern across every family checked makes it likely, and likely is not checked.
    negative check: 'grepped prun|distill|up-scal|initializ.*from across 8,234 lines. One hit is a real derivation but an ABLATION, not a release: "on 50 billion tokens, initialized from a 7B model checkpoint pretrained on 4 trillion tokens".'
    OLMo-2-0425-1B VERIFIED: 'https://huggingface.co/allenai/OLMo-2-0425-1B , read 2026-08-15. Trained INDEPENDENTLY FROM SCRATCH: stage 1 ~3.9T tokens of OLMo-mix-1124 (~1 epoch, 95%+ of its budget), stage 2 50B of Dolmino-Mix-1124. Not pruned, not distilled. And a detail that shows it is its own path: "1B Model: only 1 version is trained on a 50B mix (ingredient 3), we did not merge" -- the larger sizes were souped from three runs and the 1B was not. The earlier UNVERIFIED marking is discharged.'
  reasoning:
    _about: '`reasoning: true` marks a checkpoint whose POST-TRAINING targets reasoning. It was recorded nowhere: two models reached it by a `distill` edge and five only by having ''Think'' or ''reasoning'' in their NAME.'
    why a NODE flag and not an op: Olmo's Think branch reaches its base by plain `sft` and `dpo` edges -- STRUCTURALLY IDENTICAL to the Instruct branch. Two post-training recipes from one pretraining run, distinguishable only by the string. Renaming the op would be false (it IS an SFT); the difference is in what the recipe TARGETS, which is a property of the resulting model.
    what it buys: Olmo-3-1025-7B now carries two labelled ladders from one base -- Instruct (sft->dpo->rlvr) and Think (sft->dpo) -- which is a RECIPE contrast with pretraining held exactly fixed, the cleanest kind in the roster.
    NOT a mode: distinct from the archive's Circuit Mode.RAW/CHAT/THINK, which switches TEMPLATES on one set of weights. These are different weights.
    marked:
    - allenai/Olmo-3-7B-Think
    - allenai/Olmo-3-7B-Think-DPO
    - allenai/Olmo-3-7B-Think-SFT
    - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    - microsoft/Phi-4-reasoning-plus
    - microsoft/phi-4-reasoning
