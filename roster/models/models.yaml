    _about: '`is_representative` is DERIVED (nearest 8B over the scale group, then everything reached by aligning ops). Until now there was NOWHERE TO DISAGREE with a pick. An entry here names the checkpoint that carries its scale group instead, and the builder honours it over the size rule.'
