# dpo -> apo. There is NO DPO anywhere in SmolLM3's recipe; the card names the
# post-training stages as "Mid training, SFT, APO soup, and LC expert", and
# SmolLM3-3B's own card says "alignment via Anchored Preference Optimization
# (APO)". `dpo` here was a placeholder for "the preference step".
#
# THE PARENT EDGE (Base -sft-> -checkpoints) IS CORRECT AND STAYS, which is not
