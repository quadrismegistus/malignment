# COMPRESSION here and deliberately so (RH, "for now"). The real last operation is
# a MERGE: "Take each APO checkpoint and create a model 'soup'. Combine the model
# soup with a mid-training checkpoint that has strong long-context performance",
# linear 0.9/0.1. So the final has TWO parents and `it-LC-expert` is the second,
# not a rung after APO. We cannot declare that yet: `merge` is not in the op
# vocabulary and `par[child] = parent` is single-parent in roster.py and
# produce_movement.py -- a second parent would silently overwrite the first.
