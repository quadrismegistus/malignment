- - tiiuae/Falcon3-3B-Base
  - prune
  - tiiuae/Falcon3-1B-Base
# FAMILY KINDS. A family is (one base -> one endpoint): the ALIGNMENT RECIPE, and
# the unit for "alignment does X". `lineage` is the pretraining run underneath it
# and is the CLUSTER, not the unit -- 63 measured families sit on 49 lineages,
# and using the lineage would force one alignment per base, erasing exactly the
# plurality the claim is about (7 recipes on Llama-3.1-8B span 0.050-0.189 JS).
#
# Only what CANNOT be derived is declared here. First-party vs third-party is
# derivable (compare the org of base and endpoint); being an ARM OF AN EXPERIMENT
# is not, and it is the distinction that decides whether a family belongs in a
# "N of M families do X" claim. RH: "my instinct is ablations should not count".
#
#   ablation          one component removed from another family's training mix;
#                     the contrast is WITHIN the experiment, against its control
#   ablation_control  the full-mix arm those are compared against
#   method_variant    same base, same SFT, a different preference ALGORITHM.
#                     Measured: archangel's four span JS 0.007-0.008 -- four
#                     algorithms, no difference, so counting them as four
#                     recipes would quadruple a base's weight for nothing.
#
# An undeclared family is an ordinary recipe. Absence means ordinary, not unknown.
families:
  # THE GROUP'S REPRESENTATIVE. Excluding all four method_variants removed
  # pythia-2.8b from the population ENTIRELY -- a whole base lost to a rule meant
  # to stop double-counting. RH: "in the case of a branch at the endpoint
  # (archangel) we pick one". `dpo` is the pick because it is the preference op
  # the rest of the corpus uses (19 edges), so it is the arm comparable to
  # everything else; numerically the choice is near-free, the four spanning
  # JS 0.0071-0.0081.
  # RH's ruling, 2026-08-16. `Olmo-3-1025-7B` heads TWO recipes and both are
  # allenai's, so the same-publisher rule cannot decide it. `Olmo-3-7B-Instruct`
  # is the commodity form -- the general chat model an ordinary user receives --
  # and Think is a specialised reasoning branch.
  #
  # THINK STAYS IN THE ROSTER AND THIS DOES NOT REMOVE IT. sft_share's H2
  # depends on having both: Instruct 0.773 against Think 0.950 is what
  # established that the recorded "~90% SFT share" is BRANCH-SPECIFIC. This says
  # only which branch speaks for the lineage in a one-endpoint-per-lineage
  # statistic -- and because the two sit 0.18 apart, the choice moves OLMo's
  # contribution materially, which is why it is declared before the numbers
  # exist rather than after.
  olmo:
    kind: recipe
    representative: true
  olmo-think:
    kind: recipe
  # RH's ruling, 2026-08-16. MPT's base carries two recipes and neither child is
  # from the original publisher (mosaicml withdrew the repo; these are mirrors),
  # so the same-publisher rule cannot decide it. `mpt-7b-instruct` is the direct
  # instruct and is the representative.
  mpt:
    kind: recipe
    representative: true
  mpt-chat:
    kind: recipe
  # RH's ruling, 2026-08-16. Mistral-7B-v0.1 carries five recipes and EVERY other
  # one is attested `direction: inverted` (zephyr, dolphin) or has an unknown
  # method (openchat, Nous-Hermes-2). `mistral` is Mistral's own instruct and the
  # only endpoint published by the base's publisher. It is NOT safety-aligned --
  # its card says "It does not have any moderation mechanisms" -- and that is
  # recorded rather than hidden: this lineage is a CONTROL for whether the
  # effects are safety-driven or generic to instruction tuning.
  mistral:
    kind: recipe
    representative: true
  archangel-dpo: {kind: method_variant, experiment: archangel-halos, method: dpo, representative: true}
  archangel-kto: {kind: method_variant, experiment: archangel-halos, method: kto}
  archangel-ppo: {kind: method_variant, experiment: archangel-halos, method: ppo}
  archangel-slic: {kind: method_variant, experiment: archangel-halos, method: slic}
  tulu-no-safety: {kind: ablation, experiment: tulu-sft-mixture, ablates: safety}
  tulu-sft-full: {kind: ablation_control, experiment: tulu-sft-mixture}
  tulu-sft-nomath: {kind: ablation, experiment: tulu-sft-mixture, ablates: math}
  tulu-sft-nopersona: {kind: ablation, experiment: tulu-sft-mixture, ablates: persona}
  tulu-sft-nowildchat: {kind: ablation, experiment: tulu-sft-mixture, ablates: wildchat}

rulings:
  dpo_equivalent:
    meta-llama/Llama-3.1-8B: meta-llama/Llama-3.1-8B-Instruct
    EleutherAI/pythia-2.8b: ContextualAI/archangel_sft-dpo_pythia2-8b
    allenai/Olmo-3-1025-7B: allenai/Olmo-3-7B-Instruct-DPO
  representative:
    _about: '`is_representative` is DERIVED (nearest 8B over the scale group, then everything reached by aligning ops). Until now there was NOWHERE TO DISAGREE with a pick. An entry here names the checkpoint that carries its scale group instead, and the builder honours it over the size rule.'
    _format: 'scale_group_root: chosen_checkpoint   # with a reason'
    _none_yet: No override is declared. Every current pick is the size rule's, and that is stated rather than implied.
  endpoint:
    _about: '`endpoints()` returns `unresolved` when its chain cannot choose between two terminal aligned arms. An entry here IS THE CHOICE, made by a person, and it is applied ONLY to a base the chain left unresolved -- it can never overturn an answer the rules produced. A ruling for a base the rules DO resolve is reported as dead rather than applied silently.'
    _format: 'base: {endpoint: <chosen>, why: <reason>, against: <the evidence that cuts the other way>}'
    stabilityai/stablelm-2-1_6b:
      endpoint: stabilityai/stablelm-2-1_6b-chat
      ruled_by: RH, 2026-08-17, on docket [6371]
      why: >-
        Both arms are terminal, both `stabilityai`, both attested `direction: standard`,
        `safety_data: absent`, `alignment_intent: helpfulness` -- so rules 2, 3 and 5
        cannot separate them and the chain stops. RULE 5 IS NOT BEING OVERRIDDEN, IT IS
        BEING APPLIED WHERE ITS PROXY FAILS: its stated purpose is "the commodity form,
        the version end users receive", and its implementation is a publisher-string
        comparison, which is blind when both arms carry the same publisher. Between them,
        `-chat` is stabilityai's own product name; `-zephyr` is named for, and is an
        implementation of, HuggingFaceH4's published recipe -- its own attestation quotes
        "We train the model with DPO following the Zephyr recipe [70] and borrowing most
        of its hyperparameters". Two independent facts agree: chat is LATER (created
        2024-04-08 against zephyr's 2024-01-19, one day after the base), and chat's
        attested dataset list is a SUPERSET, adding `teknium/OpenHermes-2.5` and
        `argilla/dpo-mix-7k`, both recorded as "named on the chat model card only; absent
        from tech report Table 6". The report (arXiv:2402.17834) documents the zephyr
        pipeline; chat is the extended one that came after it.
      against: >-
        RECORDED BECAUSE IT CUTS THE OTHER WAY AND A RULING THAT ONLY LISTS ITS SUPPORT IS
        NOT AUDITABLE. By use, zephyr IS the version end users receive: 9,961 downloads/30d
        and 187 likes against chat's 1,688 and 34 -- roughly 6x and 5x. If rule 5's purpose
        were read as POPULARITY rather than as PUBLISHER-OF-RECORD, this ruling inverts.
        It is decided on identity, not on usage. Zephyr also has the fuller provenance,
        being the checkpoint the technical report describes.
      note: >-
        Nothing is deleted. `stablelm-2-zephyr-1_6b` keeps its node, its edge from the base
        and its cells; it is simply not the arm this lineage contributes to base->endpoint
        comparisons.
directions:
  # AUTHORED RULING, 2026-08-16, RH. OVERRIDES the attestation, which says
  # `inverted`. Both readings are kept: attestations.json is not edited, so the
  # disagreement stays visible instead of being resolved by overwrite.
  #
  # A SECOND BLIND PASS FOLLOWED THE CITATION AND THE ATTESTATION HAD NOT. The
  # `inverted` reading rests on the card's sentence "We found that removing the
  # in-built alignment of these datasets boosted performance on MT Bench and made
  # the model more helpful" -- deliberate removal, stated intent, exactly the
  # shape the criterion asks for. Following that sentence to what it NAMES:
  #   - the removal is documented on the SFT dataset card and is a PERSONA filter,
  #     "Removal of dialogues where the assistant replies with phrases like 'I do
  #     not have emotions' or 'I don't have opinions'" -- de-hedging, not
  #     refusal-stripping
  #   - the preference set picks "the highest `overall_score` as the 'chosen'
  #     completion", so REFUSALS ARE NOT THE REJECTED CLASS
  #   - the safety statement is an absence: "has not been aligned to human
  #     preferences for safety within the RLHF phase"
  #
  # So the gradient points at quality and nobody reversed anything: `standard`.
  # What is true and NOT captured by that value is that the safety component was
  # never installed -- which is what `alignment_intent` is for. A low measured
  # repression for this family must be read as ABSENCE, not as a light-touch
  # alignment recipe.
  #
  # The ruling changes no endpoint: Mistral resolves to Mistral-7B-Instruct-v0.1
  # through the representative family either way, 48 lineages, 0 unresolved. It is
  # therefore decided on evidence rather than on consequences.
  HuggingFaceH4/zephyr-7b-beta:
    direction: standard
    alignment_intent: helpfulness
    overrides_attestation: inverted
    evidence: 'card sentence reads as deliberate removal, but the SFT filter it names is de-hedging ("I do not have emotions") and the preference set ranks by overall_score with refusals not the rejected class'
    caveat: 'no safety guardrail exists. "Zephyr-7B-b has not been aligned to human preferences for safety within the RLHF phase or deployed with in-the-loop filtering of responses like ChatGPT."'
  cognitivecomputations/dolphin-2.6-mistral-7b-dpo:
    direction: inverted
    evidence: preference mixture includes unalignment/toxic-dpo-v0.1, whose card describes it as de-censoring with REFUSALS AS THE REJECTED CLASS; the upstream SFT was already refusal-stripped
    why_it_matters: every dN this campaign has measured is negative, which is consistent with REPRESSION and equally consistent with 'post-training happened'. An inverted preference stage is the discriminator, and NO ALIGNED MODEL CAN PRODUCE THE SIGN THIS ONE SHOULD PRODUCE.
    ceiling: n=1 checkpoint. An existence proof about DIRECTION. No interval, no generalisation to 'preference direction determines dN sign'.
    caveat: no SFT sibling exists, so base->dpo spans a refusal-stripped SFT AND an inverted DPO. Fatal for 'the DPO is what inverts it'; not fatal for 'this pipeline runs the other way'.
