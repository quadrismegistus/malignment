# THE ROSTER: checkpoints and the training operations between them.
# AUTHORED. Hand-edit this. No script writes it.
#
# NODES are checkpoints. EDGES are what was done to what. There are no
# `ego`/`superego` slots: those named a PSYCHIC POSITION, and a schema that
# names one has already answered the question the project is asking. Worse,
# `superego` was doing two jobs -- for OLMo it meant a released DPO
# checkpoint, for Llama an instruct model bundling SFT+preference+whatever,
# composition never separately released. 58 families had a `superego` and
# only 29 an `ego`. The Freudian reading belongs in the analysis, where it
# can be a FINDING (which stage carries the repression, and does it vary by
# family and content?) rather than a column name asserting the answer.
#
# `revision_ladder: N` = this repo publishes N branches/tags -- a training
# TRAJECTORY, not one checkpoint. 32 repos do. What is DECLARED here is that
# the ladder exists and how long it is; WHICH RUNGS WE HAVE MEASURED is a fact
# about the corpus, not a declaration, and lives in `measured_revisions`.
# Availability dwarfs coverage: 1,487 revisions published for Olmo-3-1025-7B,
# 43 measured.
#
# OPERATIONS: sft | dpo | rlvr | ppo | kto | slic | distill
#             instruct = an aligned endpoint of UNDECLARED composition
#                        (35 edges -- the LARGEST class, larger than dpo)

