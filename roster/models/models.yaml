  openGPT-X/Teuken-7B-instruct-commercial-v0.4:
    pretrained: false   # NOT A BASE, and its real base is not here. Its card and
                        # YAML name `Teuken-7B-base-v0.4`.
                        #
                        # CORRECTED 2026-08-16 after reading arXiv:2410.03730.
                        # v0.4 and v0.6 are NOT two pretraining runs -- they are
                        # two CHECKPOINTS OF ONE RUN. The paper's 5.4 "Continued
                        # Pre-Training": "the initial goal has been to train our
                        # base model up to 3T tokens ... we decided to train the
                        # model on an additional 3T tokens and therefore needed to
                        # define a new learning rate schedule", and "After 4T
                        # tokens, we replaced the English FineWeb-EDU and continued
                        # training until 6T tokens with DCLM-Baseline."
                        #
                        # The edge is still wrong and still removed: this instruct
                        # was tuned from the 4T state, and never saw the last 2T
                        # tokens of the run whose 6T endpoint we hold. But the
                        # reason is "an earlier checkpoint of the same run", not
                        # "a different run" -- which is what the first version of
                        # this note said. Node and its 2,663 cells stay, excluded
                        # from base->endpoint by the rule that excludes phi-4.
    # NO FAMILY, DELIBERATELY. A family is a RECIPE (one base -> one endpoint),
    # and this checkpoint's base is not in the roster, so no recipe can be formed
    # from it. A one-member `teuken-commercial` tag would have been a family that
    # is not one -- the assertion caught it. **An absent family here means 'no
    # measurable recipe', which is true, rather than an oversight.**
    env:
      profile: default
      why: inherited from the same-architecture sibling in this lineage; no row was built for this id before it entered the roster.
