# THE PARENT EDGE (Base -sft-> -checkpoints) IS CORRECT AND STAYS, which is not
# obvious: `-checkpoints` is a REVISION CONTAINER of 133 branches -- 118
# pretraining intermediates, 10 long-context, 4 post-training -- so the audit
# scored the REPO as `pretrain`. But this roster pins `revision: it-SFT` and the
# corpus measured exactly that (twp_cells.revision = 'it-SFT', 2,579 cells), and
# it-SFT IS the SFT stage. A repo-level method does not settle a revision-level
