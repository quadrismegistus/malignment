directions:
  cognitivecomputations/dolphin-2.6-mistral-7b-dpo:
    direction: inverted
    evidence: preference mixture includes unalignment/toxic-dpo-v0.1, whose card describes it as de-censoring with REFUSALS AS THE REJECTED CLASS; the upstream SFT was already refusal-stripped
    why_it_matters: every dN this campaign has measured is negative, which is consistent with REPRESSION and equally consistent with 'post-training happened'. An inverted preference stage is the discriminator, and NO ALIGNED MODEL CAN PRODUCE THE SIGN THIS ONE SHOULD PRODUCE.
    ceiling: n=1 checkpoint. An existence proof about DIRECTION. No interval, no generalisation to 'preference direction determines dN sign'.
    caveat: no SFT sibling exists, so base->dpo spans a refusal-stripped SFT AND an inverted DPO. Fatal for 'the DPO is what inverts it'; not fatal for 'this pipeline runs the other way'.
