engine_recovery:
  _why: "architecture -> box that can host it, for architectures vLLM REMOVED or never supported. Keyed on ARCHITECTURE because that is the fact's shape: BaichuanForCausalLM went after 0.23.0 and every Baichuan went with it."
  AquilaForCausalLM: vllm022_a100
  BaichuanForCausalLM: vllm022_a100
  JAISLMHeadModel: vllm0220_a100
  OlmoHybrid: vllm_nightly
  RwkvForCausalLM:
  PhariaForCausalLM:
  Zamba2ForCausalLM:
  RecurrentGemmaForCausalLM:
sizing:
  why: min_vram_gb and num_gpus are a STEP FUNCTION of measured params_b, verified with no overlaps across 159 archive rows. Declared as a rule so 160 checkpoints do not each carry a derived number with no producer.
  steps:
  - max_params_b: 9
    vram_gb: 24
    gpus: 1
  - max_params_b: 17
    vram_gb: 48
    gpus: 1
  - max_params_b: 35
    vram_gb: 80
    gpus: 1
  - max_params_b:
    vram_gb: 80
    gpus: 2
