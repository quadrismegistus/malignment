# ENVIRONMENTS: what a checkpoint needs, and what to rent to give it.
# AUTHORED. Hand-edit this. Ingested once from the archive on 2026-08-16 by
# scripts/ingest_environments.py, which is a record of that ingest and not a
# maintenance tool.

# TWO VOCABULARIES, AND THEY ARE NOT THE SAME ONE. `profiles` are what a MODEL
# needs. `boxes` are machine SHAPES to rent. They were separate files in the
# archive with the map between them buried in scripts/build_fleet.py:78, so a
# seat reading either one alone could not answer "what do I rent for this model".

# WHAT IS NOT HERE: whether a model LOADED. That is a property of
# (model x environment), not of either, and it lives in
# roster/models/observations.json -- seven models carry both a failure and a
# success. Nor (architecture x engine) support: Aquila is not broken, vLLM
# DELETED it after v0.24.0.

# CARDS: compute capability, because bfloat16 IS NOT A MODEL PROPERTY ALONE.
# `compute_dtype: bfloat16` is stored per model, and it is really a property of
# (MODEL x CARD GENERATION): bf16 arrives with Ampere (cc 8.0). Baichuan2
# auto-selects bf16 and FAILS TO LOAD on a Turing Quadro RTX 8000 (cc 7.5)
# while loading fine on Ampere -- the same shape of mis-keying as `launch:`
# (keyed on library pin when a box is a function of size) and repo status
# (keyed on model x environment when a 404 is global).
#
# THIS IS NOT HYPOTHETICAL AND WE HAVE BEEN LUCKY. The Quadro RTX 8000 is our
# MOST-RENTED card (48 of 116 gpu-labelled rate observations), the `dense` box
# deliberately carries NO gpu_name filter (selection is by capability: VRAM,
# link, disk), and offers are sorted by price -- as of 2026-08-22 the cheapest
# 48 GB offer on the board IS a `Q RTX 8000`. Twelve models declare bfloat16
# and not one has ever landed on a Turing card. Nothing prevented it.
#
# vast.ai does NOT expose compute capability on an offer: `cuda_max_good` is
# the host driver's CUDA version, not the card's. `gpu_name` is the only
# signal, and it is spelled differently in different feeds -- the search feed
# says `Q RTX 8000` where the rate store says `Quadro RTX 8000`. Both spellings
# are listed for that reason.
#
# UNKNOWN CARDS FAIL CLOSED for a bf16 requirement. A card we cannot name might
# be Turing, and the cost of refusing an offer is one more search while the
# cost of accepting a bad one is a load failure after paying for the download.
cards:
  _why: 'bfloat16 requires compute capability >= 8.0 (Ampere). Add a card here when a fleet first sees it; unknown names are refused for bf16 work.'
  _unknown_policy: refuse-for-bf16
  Q RTX 8000: {compute_capability: 7.5, arch: turing}
  Quadro RTX 8000: {compute_capability: 7.5, arch: turing}
  Tesla T4: {compute_capability: 7.5, arch: turing}
  TITAN RTX: {compute_capability: 7.5, arch: turing}
  RTX 4090: {compute_capability: 8.9, arch: ada}
  NVIDIA GeForce RTX 4090: {compute_capability: 8.9, arch: ada}
  RTX 6000Ada: {compute_capability: 8.9, arch: ada}
  NVIDIA RTX 6000 Ada Generation: {compute_capability: 8.9, arch: ada}
  L40S: {compute_capability: 8.9, arch: ada}
  A100_SXM4: {compute_capability: 8.0, arch: ampere}
  A100 SXM4: {compute_capability: 8.0, arch: ampere}
  NVIDIA A100-SXM4-80GB: {compute_capability: 8.0, arch: ampere}
  A100 PCIE: {compute_capability: 8.0, arch: ampere}
  A6000: {compute_capability: 8.6, arch: ampere}
  RTX 3090: {compute_capability: 8.6, arch: ampere}
  H100 SXM: {compute_capability: 9.0, arch: hopper}
  H100 PCIE: {compute_capability: 9.0, arch: hopper}
profiles:
  # REQUIREMENT profiles -- what a MODEL needs.
  # `launch:` names the box below. AN ENVIRONMENT IS NOT A MACHINE SHAPE:
  # `tf457` and `torch26` describe PACKAGE state, so a vast search naming
  # them finds nothing -- the pin is applied after setup. `torch26`
  # collapses onto a normal box because every box already pins torch>=2.6,
  # which is why it exists as a LABEL and not as a provisioning difference.

  # `launch:` IS ADVISORY AND MIS-KEYED. DO NOT PLAN A FLEET FROM IT.
  # Nothing reads it. `fleet_launch.shard_profile()` derives the box from
  # `sizing:` on the shard's BIGGEST model, and that is correct: a box is a
  # function of SIZE, while a profile groups by LIBRARY PIN, and the two are
  # orthogonal. `tf457` holds 13 checkpoints of which only 4 are 32B, so NO
  # single `launch:` value can be right for it -- it reads `dense` (48 GB)
  # for models the sizing rule puts on 80.
  # It disagrees with what the launcher actually rents for 16 of 160 nodes.
  # On 2026-08-22 a costed fleet plan was built on this field before anyone
  # checked what the launcher does; `scripts/check_record.py` now tests the
  # real path and reports the mismatches so the next reader is warned here
  # rather than after renting.
  bf16:
    why: 'compute in bfloat16, NOT float16: fp16 overflows the SSM scan and yields all-NaN logits on prompts >=13 tokens (1/12 finite at fp16, 12/12 at bf16). Storage stays f16.'
    compute_dtype: bfloat16
    torch: '>=2.6'
    transformers: '>=4.57'
    launch: big80
  default:
    why: safetensors, dense, current transformers.
    torch: '>=2.6'
    transformers: '>=4.57'
    launch: dense
  ssm:
    why: 'mamba-ssm + causal-conv1d. NOT optional for hybrids: 19.3x measured on Falcon-H1-7B (0.0670 -> 1.2933 cells/s, A100 bf16). The pure-SSM null does not generalise to hybrids.'
    compute_dtype: bfloat16
    kernels:
    - mamba-ssm
    - causal-conv1d
    torch: '>=2.6'
    transformers: '>=4.57'
    launch: ssm
  tf457:
    why: 'transformers 5.x CANNOT RUN this. The requirement is a CEILING, and it
      used to be written `==4.57.1` because the schema had no way to say so --
      which made every other profile read as "no ceiling" when it meant "ceiling
      unknown", and let `default` (>=4.57) claim to admit a version in which
      three of its own nodes do not exist. Written as a RANGE now: same
      resolution today, but it says which end is the constraint.'
    torch: '>=2.6'
    transformers: '>=4.57,<5'
    launch: dense
  torch26:
    why: "bin-only weights: transformers' check_torch_load_is_safe refuses .bin under torch<2.6 (CVE-driven torch.load policy). Thirteen models failed this way in the July grid and it read as a model problem, not an environment one."
    torch: '>=2.6'
    transformers: '>=4.57'
    launch: dense
  twogpu:
    why: ~140GB bf16 per arm; device_map=auto shards across two cards. A single card OOMs AFTER paying for the download.
    torch: '>=2.6'
    transformers: '>=4.57'
    launch: twogpu
boxes:
  # BOX shapes for `malign cloud launch --profile NAME`.

  # THERE ARE NO vast.ai TEMPLATES. The template's whole role is played by
  # `image`, and there are only five distinct images across these entries. A box
  # is (shape x image x pins); the names below are a partially-enumerated
  # cross-product, which is why "ssm on the 0.22.1 image" cannot be named today.

  # min_inet_down_mbps IS A SELECTION CRITERION AND WE NEVER FILTERED ON IT until
  # 2026-08-02: compute parallelises across GPUs and the network does not. A 4xA100
  # box at identical per-GPU price was the SLOWEST option on the board because its
  # link was 624 Mbps against a 1.42 TB roster -- 10.0 h -> 15.1 h, $42 -> $63,
  # entirely on a field nobody was looking at.
  default:
    description: One A100 80GB, the shape every twp/grid run has used.
    image: vllm/vllm-openai:latest
    gpu_name: A100_SXM4
    num_gpus: 1
    min_gpu_ram: 79
    disk_gb: 300
    min_inet_down_mbps: 2000
    min_reliability: 0.95
    cuda_max_good: 12.4
    pins:
    - torch>=2.6
    pin_reasons:
      torch>=2.6: transformers refuses .bin checkpoints under torch<2.6 (CVE-driven torch.load policy). Thirteen models failed to load in the July grid on exactly this and it read as a model problem, not an environment one. See project_torch_bin_floor.
    provides_vram_gb: 80
  bigdisk:
    description: Same card, 600 GB. For rosters whose cumulative download exceeds the default disk when --purge is not used.
    image: vllm/vllm-openai:latest
    gpu_name: A100_SXM4
    num_gpus: 1
    min_gpu_ram: 79
    disk_gb: 600
    min_inet_down_mbps: 2000
    min_reliability: 0.95
    cuda_max_good: 12.4
    pins:
    - torch>=2.6
    provides_vram_gb: 80
  ssm:
    description: "For SSM/Mamba AND hybrid (Falcon-H1) models. **THE KERNELS ARE NOT OPTIONAL FOR HYBRIDS: MEASURED 19.3x ON Falcon-H1-7B, 2026-08-03** (0.0670 -> 1.2933 cells/s on the twp loop, A100, bf16; 21.4 h -> 1.1 h for 5,166 cells). CORRECTION TO THIS FIELD'S PREVIOUS TEXT, which said kernels gave NO speedup and reasoned that twp re-runs the full sequence per tree node so the scan kernel is not binding. THE MEASUREMENT BEHIND THAT WAS SOUND AND THE GENERALISATION WAS NOT: it was taken on Falcon3-Mamba-7B, a PURE SSM (0.62-0.64 with kernels vs 0.61-0.72 without), and was quoted twice to predict no speedup for Falcon-H1, a HYBRID. Wrong by 19x. **A PRIOR TESTED ON ONE MEMBER OF A CLASS IS NOT A FACT ABOUT THE CLASS** -- pure-SSM and attention/SSM-hybrid have different binding costs. The pure-SSM null still stands for pure SSMs. ALSO REQUIRED FOR Falcon-H1: compute in bfloat16, NOT float16 -- fp16 overflows the SSM scan and yields all-NaN logits on prompts >=13 tokens (1/12 finite at fp16, 12/12 at bf16). TII's own docs: 'always use torch.bfloat16 instead of torch.float16'. Declare it per model as `compute_dtype` in the grid spec; storage stays f16. BUILD NOTE: no prebuilt wheels for cu130/torch2.11/py3.12, so both kernels compile from source. Use TORCH_CUDA_ARCH_LIST=8.0 MAX_JOBS=48 and --no-build-isolation (mamba-ssm's setup.py imports torch, which pip's isolated build env lacks). ~30 min on 128 cores. VERIFY IN USE, NOT MERELY INSTALLED: transformers falls back SILENTLY, so the check is that the log's 'fast path is not available' warning is ABSENT. ALSO PINS transformers==4.57.1 FOR ZAMBA2 -- see pin_reasons; the image's own 5.14.1 cannot load it at all, and the failure presents as a kernel problem."
    image: vllm/vllm-openai:latest
    gpu_name: A100_SXM4
    num_gpus: 1
    min_gpu_ram: 79
    disk_gb: 150
    min_inet_down_mbps: 3000
    min_reliability: 0.95
    cuda_max_good: 12.4
    pins:
    - torch>=2.6
    - mamba-ssm
    - causal-conv1d
    - transformers==4.57.1
    pin_reasons:
      mamba-ssm: "the fused selective-scan kernel. Installs ONLY with --no-build-isolation: its setup.py imports torch and pip's isolated build env has none. A finding that says 'install the kernels' without that is not runnable as written."
      causal-conv1d: the fused depthwise conv; same story
      transformers==4.57.1: "ZAMBA2 WILL NOT LOAD ON transformers 5.x AND THE ERROR NAMES NEITHER THE VERSION NOR THE MODEL'S REAL PROBLEM. On 5.14.1 (what the vllm image ships, 2026-08-10) Zyphra/Zamba2-7B fails at load with `There is an issue with your definition of tie_weights_keys for ^layers.6.shared_transformer:...` -- a v5 weight-tying validation that Zamba2's config predates: it declares transformers_version 4.49.0.dev0. Pinning 4.57.1 loads it and it scores at 1.23 p/s. 4.57 is also the floor CLAUDE.md records for OLMo 3, so it is the highest version known to satisfy both. **AND THE KERNEL WARNING LIES ON A FAILED LOAD.** While Zamba2 was failing, the log carried 'The fast path is not available because one of (selective_state_update, selective_scan_fn, causal_conv1d_fn, causal_conv1d_update, mamba_inner_fn) is None' -- the very string this profile tells you to check for. The kernels were fine: all five entry points imported, is_mamba_ssm_available() and is_causal_conv1d_available() both returned True, and once a model actually loaded the warning was ABSENT. So a fast-path warning emitted DURING a failed load is not evidence about the kernels, and reading it as such sends you to rebuild kernels that work. Check it on a load that SUCCEEDED."
    provides_vram_gb: 80
  dense:
    description: 'Cheapest 48GB-class card on a fast link, 150GB disk. NO gpu_name filter -- selection is by CAPABILITY (VRAM, link, disk), because the dense roster is one forward pass per prompt and the bill is DOWNLOAD. Peak disk is one model + margin: purge_model fires BEFORE each download and on every exit path including failure.'
    image: vllm/vllm-openai:latest
    num_gpus: 1
    min_gpu_ram: 47
    disk_gb: 150
    min_inet_down_mbps: 5000
    min_reliability: 0.95
    cuda_max_good: 12.4
    pins:
    - torch>=2.6
    pin_reasons:
      torch>=2.6: transformers refuses .bin checkpoints under torch<2.6 (CVE-driven torch.load policy). Thirteen models failed to load in the July grid on exactly this and it read as a model problem, not an environment one. See project_torch_bin_floor.
    provides_vram_gb: 48
  big80:
    description: One 80GB card, 150GB disk, fast link. For the 32B pair, which needs >48GB VRAM but not two cards and not 600GB of disk.
    image: vllm/vllm-openai:latest
    gpu_name: A100_SXM4
